<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>數位邏輯電路模擬器</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#14305a;--line:#c5d0e0;--grid:#dde5f0;--v1:#12a150;--v0:#2563eb;--vx:#d92d20;--sel:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#0e1829;--panel:#16243a;--ink:#d6e4ff;--line:#2c3f5e;--grid:#1a2a42;--v1:#3ddc84;--v0:#6ea8ff;--vx:#ff6b5e;--sel:#b69cff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Noto Sans TC",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ink)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
button.on{background:var(--ink);color:var(--bg)}button:disabled{opacity:.4;cursor:not-allowed}
#bar{display:flex;gap:4px;padding:6px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
#stBtn{display:none}
#main{flex:1;display:flex;min-height:0}
#pal{width:112px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
#pal b{margin-top:8px;font-weight:600}#customBtns{display:flex;flex-direction:column;gap:4px}
#stage{flex:1;position:relative;min-width:0}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#stat{width:230px;flex:none;background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow-y:auto}
#stat h4{margin:12px 0 4px}#stat .msg{padding:6px 8px;border-radius:6px;border:1px solid var(--line)}#stat .msg.err{border-color:var(--vx);color:var(--vx)}
.val{display:inline-block;min-width:1.6em;text-align:center;border-radius:4px;border:2px solid;font-weight:700;margin-right:6px}
.val.v1{color:var(--v1)}.val.v0{color:var(--v0)}.val.vx{color:var(--vx);border-style:dashed}
.row{display:flex;align-items:center;margin:3px 0}.row button{padding:2px 6px;border:0;background:none}
#props{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;gap:8px;align-items:center;z-index:2}
#props input{width:5.5em;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
#toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}
#toast.show{opacity:1}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(560px,92vw)}
dialog::backdrop{background:#0008}dialog textarea{width:100%;height:160px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
dialog input[type=text]{width:100%;padding:6px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}
/* SVG */
.body{fill:var(--panel);stroke:var(--ink);stroke-width:2}.body.sel{stroke:var(--sel);stroke-dasharray:6 4}.body.osc{stroke:var(--vx);stroke-width:3}
text{fill:var(--ink);font-size:12px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
text.big{font-size:18px;font-weight:700}text.pv{font-size:10px;font-weight:700}
.w{fill:none;stroke-width:2.5}.v1{stroke:var(--v1)}.v0{stroke:var(--v0)}.vx{stroke:var(--vx);stroke-dasharray:6 4}
.w.sel{stroke-width:5;filter:drop-shadow(0 0 4px var(--sel))}
text.t1{fill:var(--v1)}text.t0{fill:var(--v0)}text.tx{fill:var(--vx)}
.pin{fill:var(--panel);stroke-width:2}.pin.hot{r:8}.box{fill:#7c3aed22;stroke:var(--sel);stroke-dasharray:4 3}
@media(max-width:760px){
 #main{flex-direction:column-reverse}#pal{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line)}
 #pal b{display:none}#custom,#customBtns{display:contents}#stBtn{display:block}
 #stat{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:55vh;border:1px solid var(--line);transform:translateY(100%);transition:transform .25s;z-index:5;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
 #stat.open{transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* 起始畫面 */
[hidden]{display:none!important}
#home{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.hbox{width:min(520px,100%);margin:auto;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.hlogo{width:96px;height:48px;fill:none;stroke-width:3;stroke-linecap:round}
.eyebrow{margin:14px 0 2px;font-size:12px;letter-spacing:.18em;color:var(--v0);font-weight:600}
#home h1{margin:0;font-size:clamp(28px,7vw,44px);line-height:1.15}
.sub{margin:8px 0 22px;opacity:.75}
.hmenu{display:grid;gap:10px}
.hmenu button{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border-radius:10px;border-width:2px}
.hmenu button b{font-size:17px}.hmenu button span{font-size:13px;opacity:.7;white-space:normal}
.hmenu button:hover{transform:translateY(-1px);box-shadow:0 4px 14px #0002}
.hmenu button.back{padding:8px 12px;flex-direction:row;background:none;border-style:dashed}
.link{margin-top:14px;border:0;background:none;text-decoration:underline;opacity:.7;padding:4px 0}
@media(prefers-reduced-motion:reduce){.hbox{animation:none}.hmenu button:hover{transform:none}}
</style>
</head>
<body>
<header id="bar">
  <button data-act="sel" class="on" title="選取與移動">選取</button>
  <button data-act="wire" title="依序點選兩個接腳連線">連線</button>
  <button data-act="box" title="拖曳畫選取框">框選</button>
  <button data-act="pack" title="把選取的電路封裝成元件">封裝</button>
  <button data-act="project">專案</button>
  <button data-act="lib">元件庫</button>
  <button data-act="del">刪除</button>
  <button data-act="undo">復原</button>
  <button data-act="redo">重做</button>
  <button data-act="zout" aria-label="縮小">−</button>
  <button data-act="zlbl" id="zlbl" title="顯示全部">100%</button>
  <button data-act="zin" aria-label="放大">＋</button>
  <button data-act="step" title="所有 CLOCK 翻轉一次">單步</button>
  <button data-act="run" id="runBtn">執行</button>
  <button data-act="reset" title="清除所有記憶狀態">重設狀態</button>
  <button data-act="home" title="回到起始畫面">首頁</button>
  <button data-act="clear">清空</button>
  <button data-act="status" id="stBtn">狀態</button>
</header>
<div id="main">
  <aside id="pal">
    <b>輸入／輸出</b>
    <button data-add="INPUT">INPUT</button><button data-add="OUTPUT">OUTPUT</button><button data-add="CLOCK">CLOCK</button>
    <b>邏輯閘</b>
    <button data-add="AND">AND</button><button data-add="OR">OR</button><button data-add="NOT">NOT</button>
    <button data-add="NAND">NAND</button><button data-add="NOR">NOR</button><button data-add="XOR">XOR</button><button data-add="XNOR">XNOR</button>
    <div id="custom" hidden><b>自訂元件</b><span id="customBtns"></span></div>
  </aside>
  <section id="stage">
    <div id="props" hidden></div>
    <div id="toast" role="status"></div>
    <svg id="cv" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><g id="world"><rect x="-6000" y="-6000" width="12000" height="12000" fill="url(#grid)"/><g id="layer"></g></g></svg>
  </section>
  <aside id="stat"></aside>
</div>
<div id="home" role="dialog" aria-modal="true" aria-labelledby="homeTitle">
  <div class="hbox">
    <svg class="hlogo" viewBox="0 0 120 60" aria-hidden="true"><path d="M0 20H10M0 40H10" stroke="var(--v1)"/><path d="M10 8H50A22 22 0 0 1 50 52H10Z" stroke="var(--ink)" fill="var(--panel)"/><path d="M72 30H116" stroke="var(--v0)"/></svg>
    <p class="eyebrow">LOGIC CIRCUIT SIMULATOR</p>
    <h1 id="homeTitle">數位邏輯電路模擬器</h1>
    <p class="sub">拖曳邏輯閘、連線，即時觀察 0 與 1 如何在電路中流動。</p>
    <nav id="homeMain" class="hmenu" aria-label="主選單">
      <button data-h="new"><b>新建專案</b><span>從空白畫布開始設計</span></button>
      <button data-h="examples"><b>範例</b><span>栓鎖、加法器等現成電路</span></button>
      <button data-h="import"><b>導入專案</b><span>開啟先前匯出的 .json 專案檔</span></button>
      <button data-h="resume" hidden><b>繼續編輯</b><span>回到目前的畫布</span></button>
    </nav>
    <nav id="homeEx" class="hmenu" aria-label="範例清單" hidden>
      <button data-h="back" class="back">← 返回主選單</button>
      <div id="exList" class="hmenu"></div>
    </nav>
    <input id="homeFile" type="file" accept=".json,application/json" hidden>
    <button class="link" data-h="paste">改用貼上 JSON 文字匯入</button>
  </div>
</div>
<dialog id="dlg"></dialog>
<script>
'use strict';
/* ================= gates：閘定義、尺寸、接腳 ================= */
const GATES = ['AND', 'OR', 'NOT', 'NAND', 'NOR', 'XOR', 'XNOR'];
const IO = ['INPUT', 'OUTPUT', 'CLOCK'];
const ni = c => c.type === 'CHIP' ? c.pi.length : ({ INPUT: 0, CLOCK: 0, OUTPUT: 1, NOT: 1 }[c.type] ?? 2);
const no = c => c.type === 'CHIP' ? c.po.length : c.type === 'OUTPUT' ? 0 : 1;
const isGate = c => GATES.includes(c.type);
const size = c => c.type === 'CHIP' ? { w: 100, h: 40 * Math.max(c.pi.length, c.po.length, 1) } : isGate(c) ? { w: 80, h: 60 } : { w: 60, h: 40 };
const snapG = n => Math.round(n / 10) * 10;
function ev(t, [x, y]) {
  x ??= null; y ??= null;
  const inv = r => r == null ? null : 1 - r;
  switch (t) {
    case 'BUF': return x;
    case 'NOT': return inv(x);
    case 'AND': return x === 0 || y === 0 ? 0 : x == null || y == null ? null : 1;
    case 'NAND': return inv(ev('AND', [x, y]));
    case 'OR': return x === 1 || y === 1 ? 1 : x == null || y == null ? null : 0;
    case 'NOR': return inv(ev('OR', [x, y]));
    case 'XOR': return x == null || y == null ? null : x ^ y;
    case 'XNOR': return inv(ev('XOR', [x, y]));
  }
}
/* ================= circuit：資料模型與接腳座標 ================= */
const fresh = () => ({ comps: [], wires: [], nid: 1, cnt: {}, defs: {}, dn: 1, st: {} });
let S = fresh();
const byId = id => S.comps.find(c => c.id === id);
function pinPos(c, out, i) {
  if (c.type === 'CHIP') return { x: c.x + (out ? 100 : 0), y: c.y + 20 + 40 * i };
  if (isGate(c)) return out ? { x: c.x + 80, y: c.y + 30 } : { x: c.x, y: c.y + (ni(c) === 1 ? 30 : 20 + 20 * i) };
  return { x: c.x + (out ? 60 : 0), y: c.y + 20 };
}
/* ================= simulator：展開、時序模擬、振盪偵測 ================= */
let sim = { v: {}, osc: new Set(), loop: false, unconn: 0, err: '' };
function flat(comps, wires, pre, d, ext, ins, N) {
  if (d > 8) throw Error('封裝展開超過 8 層');
  const by = {}; comps.forEach(c => by[c.id] = c);
  const okey = (c, p) => c.type === 'CHIP' ? pre + c.id + '/' + S.defs[c.d].outs[p] : pre + c.id;
  const src = (c, p) => { const w = wires.find(w => w.to.c === c.id && w.to.p === p); return w && by[w.from.c] ? okey(by[w.from.c], w.from.p) : null; };
  for (const c of comps) {
    if (c.type === 'CHIP') {
      const df = S.defs[c.d]; if (!df) throw Error('找不到元件定義');
      const e = df.pi.map((_, i) => src(c, i));
      flat(df.comps, df.wires, pre + c.id + '/', d + 1, e, df.ins, N); continue;
    }
    let t = c.type, inp = [];
    if (t === 'INPUT' && ext) { t = 'BUF'; inp = [ext[ins.indexOf(c.id)] ?? null]; }
    else if (t === 'OUTPUT') { t = 'BUF'; inp = [src(c, 0)]; }
    else if (t === 'INPUT' || t === 'CLOCK') t = 'SRC';
    else for (let i = 0; i < ni(c); i++) inp.push(src(c, i));
    N.push({ k: pre + c.id, t, inp, c });
  }
}
const okeyTop = (c, p) => c.type === 'CHIP' ? c.id + '/' + S.defs[c.d].outs[p] : '' + c.id;
function simulate() {
  const N = [];
  try { flat(S.comps, S.wires, '', 0, null, null, N); } catch (e) { sim = { v: {}, osc: new Set(), loop: false, unconn: 0, err: e.message }; return; }
  const v = {}, idx = {}, fz = new Set();
  N.forEach(n => { idx[n.k] = n; v[n.k] = n.t === 'SRC' ? n.c.val : (S.st[n.k] ?? null); });
  const get = k => k == null ? null : (v[k] ?? null);
  const lim = N.length * 3 + 20;
  const pass = ch => {
    let any = false;
    for (const n of N) {
      if (n.t === 'SRC' || fz.has(n.k)) continue;
      const r = ev(n.t, n.inp.map(get));
      if (r !== v[n.k]) { v[n.k] = r; any = true; ch && ch.add(n.k); }
    }
    return any;
  };
  const settle = () => { for (let i = 0; i < lim; i++) if (!pass()) return true; return false; };
  const freezeChanged = () => { const ch = new Set(); for (let i = 0; i < 4; i++) pass(ch); ch.forEach(k => { fz.add(k); v[k] = null; }); };
  for (let t = 0; t < 6 && !settle(); t++) freezeChanged();
  // 迴路偵測：從節點沿輸入往上游能回到自己
  const cyc = new Set();
  for (const n of N) {
    const seen = new Set(), st = [n.k]; let hit = false;
    while (st.length && !hit) for (const s of idx[st.pop()].inp) {
      if (s == null || !idx[s]) continue;
      if (s === n.k) { hit = true; break; }
      if (!seen.has(s)) { seen.add(s); st.push(s); }
    }
    if (hit) cyc.add(n.k);
  }
  // 迴路內仍未定義者：以 0 試探是否會振盪（只用於偵測，不改記憶）
  const nul = [...cyc].filter(k => v[k] == null && !fz.has(k));
  if (nul.length) {
    const save = { ...v }; nul.forEach(k => v[k] = 0);
    if (!settle()) freezeChanged();
    Object.assign(v, save); fz.forEach(k => v[k] = null); settle();
  }
  const st = {}; let un = 0;
  N.forEach(n => { if (n.t !== 'SRC') st[n.k] = v[n.k] ?? null; un += n.inp.filter(s => s == null).length; });
  S.st = st;
  sim = { v, osc: new Set([...fz].map(k => +k.split('/')[0])), loop: cyc.size > 0, unconn: un, err: '' };
}
const outVal = (c, p) => sim.v[okeyTop(c, p)] ?? null;
function inVal(c, i) {
  const w = S.wires.find(w => w.to.c === c.id && w.to.p === i), f = w && byId(w.from.c);
  return f ? outVal(f, w.from.p) : null;
}
/* ================= undo / redo ================= */
let U = [], R = [];
const snap = () => { U.push(JSON.stringify(S)); if (U.length > 100) U.shift(); R = []; };
function undo() { if (!U.length) return; R.push(JSON.stringify(S)); S = JSON.parse(U.pop()); sel.clear(); selW = null; update(); }
function redo() { if (!R.length) return; U.push(JSON.stringify(S)); S = JSON.parse(R.pop()); sel.clear(); selW = null; update(); }
/* ================= renderer ================= */
const $ = s => document.querySelector(s), svg = $('#cv'), layer = $('#layer'), world = $('#world');
let view = { x: 40, y: 40, k: 1 }, sel = new Set(), selW = null, mode = 'sel', running = false, pending = null, ghost = null, band = null, hot = null;
const vc = v => v == null ? 'x' : v;
const vt = v => v == null ? '?' : v;
function wirePts(w) {
  const a = byId(w.from.c), b = byId(w.to.c); if (!a || !b) return [];
  const p = pinPos(a, true, w.from.p), q = pinPos(b, false, w.to.p);
  if (q.x >= p.x + 20) { const m = snapG((p.x + q.x) / 2); return [p, { x: m, y: p.y }, { x: m, y: q.y }, q]; }
  const my = snapG((p.y + q.y) / 2) + (Math.abs(p.y - q.y) < 10 ? 50 : 0);
  return [p, { x: p.x + 20, y: p.y }, { x: p.x + 20, y: my }, { x: q.x - 20, y: my }, { x: q.x - 20, y: q.y }, q];
}
const pstr = ps => ps.map(p => p.x + ',' + p.y).join(' ');
let raf = 0;
const redraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
function draw() {
  world.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
  $('#zlbl').textContent = Math.round(view.k * 100) + '%';
  let h = '';
  for (const w of S.wires) {
    const a = byId(w.from.c); if (!a) continue;
    h += `<polyline class="w v${vc(outVal(a, w.from.p))}${selW === w.id ? ' sel' : ''}" points="${pstr(wirePts(w))}"/>`;
  }
  for (const c of S.comps) {
    const s = size(c), cls = 'body' + (sel.has(c.id) ? ' sel' : '') + (sim.osc.has(c.id) ? ' osc' : '');
    h += `<g><rect class="${cls}" x="${c.x}" y="${c.y}" width="${s.w}" height="${s.h}" rx="${isGate(c) ? 6 : 4}"/>`;
    const cx = c.x + s.w / 2, cy = c.y + s.h / 2;
    if (c.type === 'INPUT' || c.type === 'CLOCK') {
      h += `<text class="big t${vc(c.val)}" x="${cx}" y="${cy + 2}">${c.val}</text><text x="${cx}" y="${c.y - 8}">${esc(c.name)}${c.type === 'CLOCK' ? ' ' + c.hz + 'Hz' : ''}</text>`;
    } else if (c.type === 'OUTPUT') {
      const v = inVal(c, 0); h += `<text class="big t${vc(v)}" x="${cx}" y="${cy + 2}">${vt(v)}</text><text x="${cx}" y="${c.y - 8}">${esc(c.name)}</text>`;
    } else if (c.type === 'CHIP') {
      h += `<text x="${cx}" y="${c.y - 8}">${esc(c.name)}</text>`;
      c.pi.forEach((n, i) => h += `<text x="${c.x + 8}" y="${c.y + 20 + 40 * i - 14}" style="text-anchor:start;font-size:10px">${esc(n)}</text>`);
      c.po.forEach((n, i) => h += `<text x="${c.x + 92}" y="${c.y + 20 + 40 * i - 14}" style="text-anchor:end;font-size:10px">${esc(n)}</text>`);
    } else {
      h += `<text x="${cx - 4}" y="${cy}">${c.type}</text>`;
      if (['NOT', 'NAND', 'NOR', 'XNOR'].includes(c.type)) h += `<circle class="pin" style="stroke:var(--ink)" cx="${c.x + 84}" cy="${c.y + 30}" r="4"/>`;
    }
    for (let i = 0; i < ni(c); i++) h += pinSvg(c, false, i, inVal(c, i));
    for (let i = 0; i < no(c); i++) h += pinSvg(c, true, i, outVal(c, i));
    h += '</g>';
  }
  if (ghost) h += `<polyline class="w v0" style="stroke-dasharray:4 4" points="${ghost.a.x},${ghost.a.y} ${ghost.b.x},${ghost.b.y}"/>`;
  if (band) h += `<rect class="box" x="${Math.min(band.a.x, band.b.x)}" y="${Math.min(band.a.y, band.b.y)}" width="${Math.abs(band.a.x - band.b.x)}" height="${Math.abs(band.a.y - band.b.y)}"/>`;
  layer.innerHTML = h;
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
function pinSvg(c, out, i, val) {
  const p = pinPos(c, out, i), isHot = hot && hot.c === c.id && hot.p === i && hot.out === out;

    const a = by[w?.from?.c], b = by[w?.to?.c]; if (!a || !b) throw Error('導線端點不存在');
    if (!(w.from.p >= 0 && w.from.p < no(a)) || !(w.to.p >= 0 && w.to.p < ni(b))) throw Error('接腳編號超出範圍');
    const k = b.id + ':' + w.to.p; if (used.has(k)) continue; used.add(k);
    ws.push({ id: Number.isInteger(w.id) ? w.id : 1e6 + ws.length, from: { c: a.id, p: w.from.p }, to: { c: b.id, p: w.to.p } });
  }
  return { comps: out, wires: ws };
}
function mapDefs(raw, dn) {
  const map = {}, nd = {}; Object.keys(raw).forEach(k => map[k] = 'd' + dn++);
  for (const [k, d] of Object.entries(raw)) {
    if (!d || !Array.isArray(d.pi) || !Array.isArray(d.po) || !Array.isArray(d.ins) || !Array.isArray(d.outs)) throw Error('元件定義格式錯誤');
    nd[map[k]] = { ...d, name: String(d.name || '元件').slice(0, 8), pi: d.pi.map(x => String(x).slice(0, 8)), po: d.po.map(x => String(x).slice(0, 8)), comps: (d.comps || []).map(c => c.type === 'CHIP' ? { ...c, d: map[c.d] } : c) };
  }
  for (const d of Object.values(nd)) {
    const cl = cleanSet(d.comps, d.wires || [], nd); d.comps = cl.comps; d.wires = cl.wires;
    const t = (ids, ty) => ids.every(i => d.comps.find(c => c.id === i)?.type === ty);
    if (d.ins.length !== d.pi.length || d.outs.length !== d.po.length || !t(d.ins, 'INPUT') || !t(d.outs, 'OUTPUT')) throw Error('元件「' + d.name + '」的接腳數與內部 INPUT／OUTPUT 不一致');
  }
  return { map, nd, dn };
}
async function importText(txt) {
  try {
    const j = JSON.parse(txt); if (j?.format !== 'logic-sim') throw Error('不是本程式的檔案格式');
    if (j.kind === 'project') {
      const c = j.circuit || {}, r = mapDefs(c.defs || {}, 1);
      const cl = cleanSet((c.comps || []).map(k => k.type === 'CHIP' ? { ...k, d: r.map[k.d] } : k), c.wires || [], r.nd);
      snap(); const mx = Math.max(0, ...cl.comps.map(k => k.id), ...cl.wires.map(w => w.id));
      S = { ...fresh(), ...cl, nid: mx + 1, cnt: c.cnt && typeof c.cnt === 'object' ? c.cnt : {}, defs: r.nd, dn: r.dn };
    } else if (j.kind === 'components') {
      const r = mapDefs(j.defs || {}, S.dn); snap(); Object.assign(S.defs, r.nd); S.dn = r.dn;
    } else throw Error('未知的 kind');
    sel.clear(); hideHome(); update(); fit(); toast('匯入完成');
  } catch (e) { toast('匯入失敗：' + e.message); }
}
/* ================= 範例與工具列 ================= */
const EXAMPLES = [

    c: [['s', 'INPUT', 40, 60, { name: 'S', val: 0 }], ['r', 'INPUT', 40, 200, { name: 'R', val: 0 }], ['n1', 'NOR', 240, 40], ['n2', 'NOR', 240, 180], ['q', 'OUTPUT', 420, 60, { name: 'Q' }], ['qb', 'OUTPUT', 420, 200, { name: 'QB' }]],
    w: [['r', 0, 'n1', 0], ['n2', 0, 'n1', 1], ['s', 0, 'n2', 1], ['n1', 0, 'n2', 0], ['n1', 0, 'q', 0], ['n2', 0, 'qb', 0]] },
  { id: 'half', name: '半加器', desc: 'XOR 求和、AND 求進位，把兩個 1 位元相加。', tip: '試試 A=1、B=1：SUM=0、CARRY=1。',
    c: [['a', 'INPUT', 40, 60, { name: 'A', val: 0 }], ['b', 'INPUT', 40, 160, { name: 'B', val: 0 }], ['x', 'XOR', 220, 40], ['n', 'AND', 220, 160], ['s', 'OUTPUT', 400, 60, { name: 'SUM' }], ['c', 'OUTPUT', 400, 180, { name: 'CARRY' }]],
    w: [['a', 0, 'x', 0], ['b', 0, 'x', 1], ['a', 0, 'n', 0], ['b', 0, 'n', 1], ['x', 0, 's', 0], ['n', 0, 'c', 0]] },
  { id: 'full', name: '全加器', desc: '含進位輸入的 1 位元加法，由兩個半加器加 OR 組成。', tip: '試試 A=B=CIN=1：SUM=1、COUT=1。',
    c: [['a', 'INPUT', 40, 40, { name: 'A', val: 0 }], ['b', 'INPUT', 40, 120, { name: 'B', val: 0 }], ['ci', 'INPUT', 40, 240, { name: 'CIN', val: 0 }], ['x1', 'XOR', 200, 60], ['a1', 'AND', 200, 160], ['x2', 'XOR', 360, 80], ['a2', 'AND', 360, 200], ['o', 'OR', 520, 170], ['s', 'OUTPUT', 680, 100, { name: 'SUM' }], ['co', 'OUTPUT', 680, 190, { name: 'COUT' }]],
    w: [['a', 0, 'x1', 0], ['b', 0, 'x1', 1], ['a', 0, 'a1', 0], ['b', 0, 'a1', 1], ['x1', 0, 'x2', 0], ['ci', 0, 'x2', 1], ['x1', 0, 'a2', 0], ['ci', 0, 'a2', 1], ['a1', 0, 'o', 0], ['a2', 0, 'o', 1], ['x2', 0, 's', 0], ['o', 0, 'co', 0]] },
  { id: 'dl', name: 'D 栓鎖（含 CLOCK）', desc: '時脈為 1 時 Q 跟隨 D，為 0 時保持。', tip: '按「執行」讓 CLK 自動翻轉，再切換 D；CLK=0 期間 Q 不會改變。',
    c: [['d', 'INPUT', 40, 60, { name: 'D', val: 0 }], ['e', 'CLOCK', 40, 220, { name: 'CLK', val: 1, hz: 0.5 }], ['nt', 'NOT', 140, 110], ['n1', 'NAND', 260, 40], ['n2', 'NAND', 260, 200], ['nq', 'NAND', 420, 60], ['nb', 'NAND', 420, 180], ['q', 'OUTPUT', 600, 80, { name: 'Q' }], ['qb', 'OUTPUT', 600, 200, { name: 'QB' }]],
    w: [['d', 0, 'n1', 0], ['e', 0, 'n1', 1], ['d', 0, 'nt', 0], ['nt', 0, 'n2', 0], ['e', 0, 'n2', 1], ['n1', 0, 'nq', 0], ['nb', 0, 'nq', 1], ['n2', 0, 'nb', 0], ['nq', 0, 'nb', 1], ['nq', 0, 'q', 0], ['nb', 0, 'qb', 0]] },
];
function loadExample(id) {
  const ex = EXAMPLES.find(e => e.id === id); if (!ex) return;
  snap(); S = { ...fresh(), defs: S.defs, dn: S.dn }; const ids = {};
  for (const [k, type, x, y, o] of ex.c) { ids[k] = S.nid++; S.comps.push({ id: ids[k], type, x, y, rot: 0, ...o }); S.cnt[type] = (S.cnt[type] || 0) + 1; }
  for (const [a, ap, b, bp] of ex.w) S.wires.push({ id: S.nid++, from: { c: ids[a], p: ap }, to: { c: ids[b], p: bp } });
  sel.clear(); selW = null; hideHome(); update(); fit(); toast(ex.name + '：' + ex.tip);
}
/* ================= home：起始畫面 ================= */
const home = $('#home');
function showHome(view = 'main') {
  const has = S.comps.length > 0;
  $('#homeMain').hidden = view !== 'main'; $('#homeEx').hidden = view !== 'ex';
  $('[data-h=resume]').hidden = !has; home.hidden = false;
  $('#exList').innerHTML = EXAMPLES.map(e => `<button data-ex="${e.id}"><b>${esc(e.name)}</b><span>${esc(e.desc)}</span></button>`).join('');
  (view === 'ex' ? $('[data-h=back]') : home.querySelector('.hmenu button:not([hidden])'))?.focus();
}
const hideHome = () => { home.hidden = true; };
home.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.ex) return loadExample(t.dataset.ex);
  switch (t.dataset.h) {
    case 'new': if (S.comps.length && !confirm('目前的畫布與自訂元件將被清空（可用「復原」找回）。要新建專案嗎？')) return;
      snap(); S = fresh(); sel.clear(); selW = null; hideHome(); update(); fit(); break;
    case 'examples': showHome('ex'); break;
    case 'back': showHome('main'); break;
    case 'resume': hideHome(); break;
    case 'import': $('#homeFile').click(); break;
    case 'paste': projectDlg(); break;
  }
});
$('#homeFile').addEventListener('change', async e => {
  for (const f of e.target.files) { if (f.size > 5 * 1048576) { toast('檔案超過 5 MB：' + f.name); continue; } await importText(await f.text()); }
  e.target.value = '';
});
const acts = {
  sel: () => setMode('sel'), wire: () => setMode('wire'), box: () => setMode('box'), pack, project: projectDlg, lib: libDlg, del: delSel, undo, redo,
  zout: () => zoomAt(innerWidth / 2, innerHeight / 2, view.k / 1.2), zin: () => zoomAt(innerWidth / 2, innerHeight / 2, view.k * 1.2), zlbl: fit, step,
  run: () => { if (!running && !S.comps.some(c => c.type === 'CLOCK')) return toast('畫布上沒有 CLOCK'); running = !running; $('#runBtn').textContent = running ? '暫停' : '執行'; },
  reset: () => { snap(); S.st = {}; update(); },
  home: () => showHome('main'), clear: () => { if (!S.comps.length || confirm('清空整個畫布？（可復原）')) { snap(); S = { ...fresh(), defs: S.defs, dn: S.dn }; sel.clear(); update(); } },
  status: () => $('#stat').classList.toggle('open'),
};
function setMode(m) { mode = m; pending = null; hot = null; ['sel', 'wire', 'box'].forEach(k => $(`[data-act=${k}]`).classList.toggle('on', k === m)); redraw(); }
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.act) acts[t.dataset.act]();
  if (t.dataset.add) addComp(t.dataset.add);
  if (t.dataset.chip) addComp('CHIP', t.dataset.chip);
  if (t.dataset.tg) { const c = byId(+t.dataset.tg); snap(); c.val ^= 1; update(); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;

  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); delSel(); }
  else if (m && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (m && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (e.key === 'Escape') { pending = null; hot = null; wiring = null; ghost = null; sel.clear(); selW = null; update(); }
  else if (e.key === '+' || e.key === '=') acts.zin(); else if (e.key === '-') acts.zout();
});
addEventListener('resize', redraw);
update();
showHome('main');
